<!-- Find out Blood donation form image and create one HTML form with same fields. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: antiquewhite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: brown;
            margin-bottom: 20px;
        }

        form {
            background: #faf4f4;
            padding: 25px;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: left;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="number"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .radio-group input {
            width: auto;
            margin-right: 5px;
        }

        .radio-group label {
            font-weight: normal;
            display: inline;
            margin-bottom: 0;
        }
        
        .terms {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .terms input {
            margin-top: 3px;
        }

        .terms label {
            font-weight: normal;
            margin-bottom: 0;
        }

        .buttons {
            text-align: center;
            margin-top: 20px;
        }

        .buttons input {
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
            background-color: brown;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        .buttons input[type="reset"] {
            background-color: #666;
        }
    </style>
</head>
<body>
    <h1>Blood Donation Form</h1>
    <form action="/submit" method="post">
        <div class="form-group">
            <label for="name">Full Name :</label>
            <input type="text" id="name" name="name" placeholder="Enter Name" required>
        </div>

        <div class="form-group">
            <label for="age">Age :</label>
            <input type="number" id="age" name="age" placeholder="Enter Age" min="18" max="65" required>
        </div>

        <div class="form-group">
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
        </div>

        <div class="form-group">
            <label>Gender :</label>
            <div class="radio-group">
                <input type="radio" id="male" name="gender" value="Male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>
                <input type="radio" id="other" name="gender" value="Other">
                <label for="other">Other</label>
            </div>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="9876543210" pattern="[0-9]{10}" required>
        </div>

        <div class="form-group">
            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="3" required></textarea>
        </div>

        <div class="form-group">
            <label for="bloodgroup">Blood Group:</label>
            <select id="bloodgroup" name="bloodgroup" required>
                <option value="">--Select--</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
        </div>

        <div class="terms">
            <input type="checkbox" id="consent" name="consent" required>
            <label for="consent">I hereby accept Terms & Conditions of registering as blood donor.</label>
        </div>

        <div class="buttons">
            <input type="submit" value="Register">
            <input type="reset" value="Reset">
        </div>
    </form>
</body>
</html>

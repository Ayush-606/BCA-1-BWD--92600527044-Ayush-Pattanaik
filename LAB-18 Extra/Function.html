<!-- Write a simple JavaScript program to demonstrate different types of functions -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions</title>
</head>
<body>

    <h1>JavaScript Functions</h1>

    <script>
        // Function without parameters and without return value
        function add() {
            var a = 10;
            var b = 20;
            var sum = a + b;
            document.write("The sum of " + a + " and " + b + " is: " + sum);
        }

        // Function without parameters but with return value
        function subtract() {
            var a = 20;
            var b = 10;
            return a - b;
        }

        // Function with parameters and without return value
        function multiply(a, b) {
            var product = a * b;
            document.write("<br>The product of " + a + " and " + b + " is: " + product);
        }

        // Function with parameters and with return value
        function divide(a, b) {
            return a / b;
        }

        add();

        document.write("<br>The difference of 20 and 10 is: " + subtract());

        multiply(5, 4);

        document.write("<br>The division of 20 by 5 is: " + divide(20, 5));

    </script>

</body>
</html>

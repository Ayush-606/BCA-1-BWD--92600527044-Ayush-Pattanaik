<!-- 1. Create a simple table which shows only 2 columns like Student Name and city. -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Table</title>

        <style>
            table {
                width: 50%;
                border-collapse: collapse;
                margin: 20px auto;
            }

            th, td {
                border: 1px solid black;
                padding: 10px;
                text-align: center;
            }

            th {
                background-color: lightblue;
            }

            h2 {
                text-align: center;
            }
        </style>
    </head>

    <body>

        <h2>Student Details</h2>

        <table>
            <tr>
                <th>Student Name</th>
                <th>City</th>
            </tr>

            <tr>
                <td>Ayush</td>
                <td>Rajkot</td>
            </tr>

            <tr>
                <td>Rakesh</td>
                <td>Ahmedabad</td>
            </tr>

            <tr>
                <td>Devansh</td>
                <td>Surat</td>
            </tr>

        </table>

    </body>
</html>

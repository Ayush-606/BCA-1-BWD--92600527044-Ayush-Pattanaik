<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Demo</title>
        <style>
            body{
                background-color: antiquewhite;
                margin: 0;
                padding: 0;
                text-align: center;
                font-family: 'Courier New', Courier, monospace;
                font-size: medium;
            }
            header{
                background-color:bisque ;
                border: 3px solid black;
                border-radius: 9px;
                margin: 20px;
                padding: 10px;
            }
            
            footer{
                color: gray;
                background-color: bisque;
                text-align: end;
            }
        </style>
    </head>
    <body>
        <header>
            HTML NESTED ELEMENTS
        </header>
        <hr>
        <main>
            <h1>Project&nbsp;1</h1><br><hr>

            <div class="first"></div>
            <div id="second"></div>

            <p><i>italic element<i><p><hr>
            <p><b>bold element</b></p><hr>
            <p><u>underline element</u></p><hr>
            <p><em>emphasis element</em></p><hr>
            <p><big>big element</big></p><hr>
            <p><small>small element</small></p><hr>
            <p><strong>strong element</strong></p><hr>
            <p><a href="">anchor tag</a></p><hr>
            <p><del>deleted tag</del></p><hr>
            <p><mark>highlight element</mark></p><hr>
            <p class="one">C+O<sub>2</sub> = CO<sub>2</sub> </p><hr>

            <img src="im.jpg" alt="Feather Image" height="100px" width="70px">
            
            
        </main>
        <hr>
        <footer>
            Created By Nested HTML Elements
        </footer>
    </body>
</html>

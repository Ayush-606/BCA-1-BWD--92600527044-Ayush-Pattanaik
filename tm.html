<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Text</title>

    <style>
        body{
            background-color: antiquewhite;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container{
            display: flex;
            border: 2px solid black;
            border-radius: 5px;
        }

        .im{
            width: 55%;
        }

        .text{
            width: 45%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="im">
            <img src="..\im1.jpg" alt="">
        </div>
        <div class="text">
            <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Eaque, ea rerum. Similique nostrum aliquid consequatur voluptate magni qui est nemo explicabo error culpa cumque beatae provident libero adipisci quae dicta delectus, asperiores porro nam!</p>
        </div>
    </div>
</body>
</html>

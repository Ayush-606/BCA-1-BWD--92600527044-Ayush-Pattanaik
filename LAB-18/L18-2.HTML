<!-- 2. Write a program in Java Script which allows certain fields like Name, Age, Gender, Cite, State and Country. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details</title>
</head>
<body>
    <script>
        var name = prompt("Enter your name:");
        var age = prompt("Enter your age:");
        var gender = prompt("Enter your gender:");
        var city = prompt("Enter your city:");
        var state = prompt("Enter your state:");
        var country = prompt("Enter your country:");

        alert("Name: " + name + "\nAge: " + age + "\nGender: " + gender + "\nCity: " + city + "\nState: " + state + "\nCountry: " + country);
    </script>
</body>
</html>

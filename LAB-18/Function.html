<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions</title>
</head>
<body>
    
</body>
<script>
    function add(){
        var a = 10;
        var b = 20;
        var sum = a + b;
        document.write("The sum of " + a + " and " + b + " is: " + sum);
    }

    function subtract(){
        var a = 20;
        var b = 10;
        return a - b;
    }

    function multiply(var a, var b){
        var product = a * b;
        document.write("<br>The product of " + a + " and " + b + " is: " + product);
    }

    function divide(var a, var b){
        return a / b;
    }

    add();
    document.write("<br>The difference of 20 and 10 is: " + subtract());
    multiply(5, 4);
    document.write("<br>The division of 20 by 5 is: " + divide(20, 5));    

</script>
</html>

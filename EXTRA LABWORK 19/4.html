<!-- Write a javascript program to take input from user and check if the number is armstrong or not -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armstrong</title>
</head>
<body>
    
</body>
<script>
    let number = parseInt(prompt("Enter a number:"));
    let sum = 0;
    let temp = number;
    let digits = number.toString().length;

    while (temp > 0) {
        let digit = temp % 10;
        sum += Math.pow(digit, digits);
        temp = Math.floor(temp / 10);
    }

    if (sum === number) {
        alert(number + " is an Armstrong number.");
    } else {
        alert(number + " is not an Armstrong number.");
    }
</script>
</html>

<!-- Write a javascript program to print pyramid structure using while loop -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyramid</title>
</head>
<body align="center">
    
</body>
<script>
    let rows = parseInt(prompt("Enter the number of rows for the pyramid:"));
    let i = 1;

    while (i <= rows) {
        let spaces = rows - i;
        let stars = 2 * i - 1;

        let line = " ".repeat(spaces);

        line += "*".repeat(stars);

        document.write(line+"<br>");
        i++;
    }
</script>
</html>

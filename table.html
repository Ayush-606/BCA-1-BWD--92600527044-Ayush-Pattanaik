<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Group Elements</title>
        <style>
            body{
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                background-color: bisque;
                text-align: center;
            }
            
            table{
                width: 200px;
                margin: 20px;
                background-color: rgb(247, 227, 227);
                border: solid black;
                /* border-collapse: collapse; */
                box-shadow: 0 5 12;
            }
            
            th{
                padding: 0;
                background-color: antiquewhite;
            }
            
            td :nth-child(even){
                background-color: rgb(66, 62, 62);
            }
            
            tr:hover{
                background-color: rgb(111, 233, 233);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <table border="1" bgcolor=rgb (126,34,44)>
                <!-- <tr>
                    <th>Sr. No</th>
                    <th>Name</th>
                    <th>Marks</th>
                </tr> -->
                <tr>
                    <td rowspan="2">1</td>
                    <td>2</td>
                    <td>3</td>
                </tr>
                <tr>
                    <td colspan="2">4</td>
                </tr>
                <tr>
                    <td>5</td>
                    <td>6</td>
                    <td>7</td>
                </tr>
            </table>
        </div>
    </body>
</html>

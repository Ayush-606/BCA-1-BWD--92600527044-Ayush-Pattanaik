<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="First">

        <div class="left">
        
            <img src="mu.jpg" alt="College Logo"><br>
            
            <h1>Student Portal</h1><br>
            
            <p>
                Welcome to the Student Registration Portal.
                Please fill in the form to complete your registration.
            </p>
            
        </div>
        
        <div class="container">
        
            <h2>Registration Form</h2>
            
            <form action="#" method="post">
            
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone number" placeholder="9876543210">
                
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob">
                
                <label>Gender</label>
                
                <div class="radio-group">
                
                    <input type="radio" id="male" name="gender" value="Male">
                    <label for="male">Male</label>
                    
                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>
                    
                    <input type="radio" id="other" name="gender" value="Other">
                    <label for="other">Other</label>
                
                </div>
                
                <label for="options">Options</label>
                
                <select id="options" name="options">
                    <option value="">-- Select Option --</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                </select>
                
                
                <label for="comment">Comments</label>
                
                <textarea id="comment" name="comment" rows="4" placeholder="Write your comments here..."></textarea>
                
                <div class="buttons">
                
                    <input type="submit" value="Submit">
                    
                    <input type="reset" value="Reset">
            
                </div>
        
            </form>
        
        </div>
        
    </div>
        
</body>
</html>

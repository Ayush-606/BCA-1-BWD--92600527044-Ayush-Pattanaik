<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

</head>
<body>
    <div class="First" align="center">
        
        <div class="container" border_box="30px">
        
            <h2>Registration Form</h2>
            
            <form action="#" method="post">
            
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                <br><br>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <br><br>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter Password" required>
                <br><br>

                <label for="cpassword">Confirm Password</label>
                <input type="password" id="cpassword" name="cpassword" placeholder="Confirm Password" required>
                <br><br>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone number" placeholder="9876543210">
                <br><br>

                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob">
                <br><br>
                
                <div class="radio-group">
                
                    Gender: <input type="radio" id="male" name="gender" value="Male">
                    <label for="male">Male</label>
                    
                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>
                    
                    <input type="radio" id="other" name="gender" value="Other">
                    <label for="other">Other</label>
                
                </div>
                <br><br>

                <label for="Address">Address</label>
                
                <textarea id="Address" name="Address" rows="4" placeholder="Write your Address here..."></textarea>
                <br><br>

                <div class="buttons">
                
                    <input type="submit" value="Sign-In">
                    
                    <input type="reset" value="Reset">
            
                </div>
        
            </form>
        
        </div>
        
    </div>
        
</body>
</html>

<!-- 1. Create a any simple table using bootstrap grid system. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table-Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <div class="row bg-dark text-white fw-bold p-2">
        <h2 class="text-center mb-4">Student Details</h2>
        <div class="row bg-dark text-white fw-bold p-2">
            <div class="col">Sr.No</div>
            <div class="col">Roll No</div>
            <div class="col">Name</div>
        </div>

        <div class="row border p-2">
            <div class="col">1.</div>
            <div class="col">7001</div>
            <div class="col">Rahul</div>
        </div>

        <div class="row border p-2">
            <div class="col">2.</div>
            <div class="col">7002</div>
            <div class="col">Raj</div>
        </div>

        <div class="row border p-2">
            <div class="col">3.</div>
            <div class="col">7003</div>
            <div class="col">Rakesh</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>

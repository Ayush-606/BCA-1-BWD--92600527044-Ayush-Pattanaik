
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>

    <style>
        body {
            background-color: rgb(44, 42, 42);
            font-family: Arial, Helvetica, sans-serif;
            color: aliceblue;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
        }

        .image-slider {
            position: relative;
            width: 500px;
            height: 400px;
            overflow: hidden;
            border-radius: 10px;
        }

        .slide {
            position: absolute;
            height: 100%;
            width: 100%;
            animation: slider 9s infinite;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .text {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: aliceblue;
            padding: 15px;
            border-radius: 5px;
            z-index: 2;
        }

        .text h3 {
            margin: 5px;
            font-size: 20px;
        }

        .slide:nth-child(1) {
            z-index: 3;
            animation-delay: 0s;
        }

        .slide:nth-child(2) {
            z-index: 2;
            animation-delay: 3s;
        }

        .slide:nth-child(3) {
            z-index: 1;
            animation-delay: 6s;
        }

        @keyframes slider {
            0% {
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            30% {
                opacity: 1;
            }
            40% {
                opacity: 0;
            }
            100% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <h1>Image Slider</h1>

    <div class="image-slider">

        <div class="slide">
            <img src="im1.jpg" alt="Valley">
            <div class="text">
                <h3>Valley</h3>
            </div>
        </div>

        <div class="slide">
            <img src="im2.jpg" alt="Sunflowers">
            <div class="text">
                <h3>Sunflowers</h3>
            </div>
        </div>

        <div class="slide">
            <img src="im3.jpg" alt="Lake">
            <div class="text">
                <h3>Lake</h3>
            </div>
        </div>

    </div>

</body>
</html>

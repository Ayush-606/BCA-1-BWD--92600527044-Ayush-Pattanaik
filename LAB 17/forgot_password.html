<!-- Definition : Create Login Page with Logout option and Registration option ( if user click on Login Page then login detail will ask and if user click on registration page then it's display ask and option the registration page  and option of forgot password can also be working in  that ) -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(160deg, #6b9ed8, #a5cae9);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
      }

      .container {
        padding: 20px;
        border: black 2px solid;
        border-radius: 9px;
        box-shadow: 0 10px 30px black;
        background-color: #a5cae9;
      }
      
      label {
        display: block;
        margin-top: 14px;
        margin-bottom: 6px;
        color: #34495e;
        font-weight: 600;
      }

      button {
        display: block;
        width: 100%;
      }

      button:hover {
        background-color: aqua;
        color: white;
        transition: 0.5s;
      }

      h1,a{
        text-align: center;
        display: block;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
        <h1>Forgot Password</h1>
        <form action="logged_in.html">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required />
            <label for="email">Email ID</label>
            <input type="email" id="email" name="email" required /><br />
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" required />
            <label for="password">Confirm Password</label>
            <input type="password" id="password" name="password" required />
            <br /><br />
            <a href="logged_in.html"><button type="submit">Login</button></a>
        </form>

        <a href="index.html">Back to Home</a>
    </div>
  </body>
</html>

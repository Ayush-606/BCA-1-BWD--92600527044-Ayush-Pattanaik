  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Page</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(160deg, #6b9ed8, #a5cae9);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
      }

      .container {
        padding: 20px;
        border: black 2px solid;
        border-radius: 9px;
        box-shadow: 0 10px 30px black;
        background-color: #a5cae9;
      }

      h1,p{
        text-align: center;
      }

      a {
        display: inline-block;
        margin: 10px;
        padding: 10px 20px;
        background-color: lightblue;
        color: black;
        text-decoration: none;
        border-radius: 5px;
      }

      a:hover {
        background-color: skyblue;
      }
    </style>
  </head>

    <div class="container">
      <h1>Welcome</h1>

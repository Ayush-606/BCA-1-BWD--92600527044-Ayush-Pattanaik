<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Login Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;

        .box {

        }

        button {
            padding: 10px 25px;
            background-color: lightblue;
            border: none;
            border-radius: 5px;
        }

        a {
            display: block;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>Login Page</h2>

        <form>
            <input type="text" placeholder="Username" requireds><br>

            <input type="password" placeholder="Password"  required><br>
